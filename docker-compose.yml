# OpenScanHub with Docker Compose.
# First run:  mkdir -p scans && docker compose up -d
# Then open http://<this-machine>:8020 and follow the setup steps.
# Access token for other devices: docker exec openscan-hub openscan --show-token
services:
  openscan:
    image: ghcr.io/parallaxintelligencepartnership/openscan-hub:latest
    # To build from this folder instead of pulling, uncomment:
    # build: .
    container_name: openscan-hub
    restart: unless-stopped
    ports:
      - "8020:8020"
      # FTP receiver ("Scan to FTP" on the scanner): turn it on in Settings,
      # then uncomment the next two lines. Anyone on your network can reach them.
      # In this (bridge) mode you must also set OPENSCAN_FTP_PASSIVE_ADDRESS
      # below to this machine's LAN address, or uploads fail. Host networking
      # (network_mode: host, at the bottom) needs neither.
      # - "2121:2121"
      # - "60000-60010:60000-60010"
    volumes:
      # Settings and the access token. The named volume is the default because
      # Docker creates it owned by the container user (uid 1000), so it is
      # always writable. If you bind-mount a host folder instead, for example
      # ./config:/config, first run: sudo chown -R 1000:1000 ./config
      # Otherwise nothing can be saved and the web page shows a red warning.
      - openscan-config:/config
      - ./scans:/scans
    environment:
      # Your time zone, used for the date and time in scan file names,
      # for example America/New_York or America/Los_Angeles.
      - TZ=Etc/UTC
      # Bridge mode with the FTP receiver: the address the scanner uses to
      # reach this machine, for example 192.168.1.20.
      # - OPENSCAN_FTP_PASSIVE_ADDRESS=192.168.1.20

    # Automatic scanner discovery uses mDNS, which needs the host network.
    # If you would rather pick the scanner by IP address, leave this as is.
    # To turn discovery on, uncomment the next line and remove "ports:" above.
    # network_mode: host

volumes:
  openscan-config:
