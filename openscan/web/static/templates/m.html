<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="OpenScanHub">
    <title>OpenScanHub</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/m.css">
</head>
<body>
    <main class="app">
        <header class="bar">
            <h1>OpenScanHub</h1>
            <span class="role hidden" id="role-note"></span>
        </header>

        <div class="notice hidden" id="notice" role="status" aria-live="polite"></div>

        <!-- Sign in -->
        <section id="view-login" class="view hidden">
            <form id="login-form" class="card">
                <label for="token">Access token</label>
                <input type="password" id="token" autocomplete="current-password" autocapitalize="off" autocorrect="off">
                <p class="hint">Use the scan token from the Settings page, or scan the phone code on the dashboard.</p>
                <button class="btn primary" type="submit">Sign in</button>
            </form>
        </section>

        <!-- Home -->
        <section id="view-home" class="view hidden">
            <div class="card status">
                <span class="dot" id="status-dot"></span>
                <div>
                    <div class="status-name" id="status-name">Checking the scanner</div>
                    <div class="hint" id="status-detail"></div>
                </div>
            </div>

            <h2 class="section">Scan with a profile</h2>
            <div class="stack" id="profile-buttons"></div>

            <h2 class="section">Several pages, one file</h2>
            <div class="card">
                <label for="profile-select">Profile</label>
                <select id="profile-select"></select>
                <div class="row">
                    <button class="btn primary" id="btn-scan-pages" type="button">Scan pages</button>
                    <label class="btn secondary" for="camera-home">Use camera</label>
                </div>
                <input type="file" id="camera-home" class="camera-input" accept="image/*,application/pdf"
                       capture="environment" multiple>
            </div>
        </section>

        <!-- Pages of one document -->
        <section id="view-session" class="view hidden">
            <div class="card">
                <div class="session-head">
                    <strong id="session-title">Pages</strong>
                    <span class="hint" id="session-count">0 pages</span>
                </div>
                <div class="row">
                    <button class="btn primary" id="btn-scan-next" type="button">Scan next page</button>
                    <label class="btn secondary" for="camera-session">Use camera</label>
                </div>
                <input type="file" id="camera-session" class="camera-input" accept="image/*,application/pdf"
                       capture="environment" multiple>
            </div>

            <ol class="pages" id="page-list" aria-label="Pages, in the order they will be saved"></ol>
            <p class="hint empty hidden" id="page-empty">No pages yet. Scan a page or use the camera.</p>

            <div class="row sticky">
                <button class="btn success" id="btn-save" type="button" disabled>Save</button>
                <button class="btn danger" id="btn-cancel" type="button">Cancel</button>
            </div>
        </section>
    </main>

    <div class="busy hidden" id="busy" role="alert" aria-live="assertive">
        <div class="spinner"></div>
        <p id="busy-text">Working</p>
    </div>

    <script src="js/m.js"></script>
</body>
</html>
