name: Release

on:
  push:
    tags:
      - 'v*'

# Nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match the version in pyproject.toml and openscan/__init__.py
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          PY_VER=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT_VER=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('openscan/__init__.py').read()).group(1))")
          echo "tag=$VERSION pyproject=$PY_VER __init__=$INIT_VER"
          if [ "$VERSION" != "$PY_VER" ] || [ "$VERSION" != "$INIT_VER" ]; then
            echo "::error::Tag $TAG does not match version $PY_VER / $INIT_VER"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build-exe:
    needs: check-version
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - edition: homelab
            artifact: OpenScanHub-Windows
            exe: OpenScanHub.exe
          - edition: office
            artifact: OpenScanHub-Windows-Office
            exe: OpenScanHub-Office.exe
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Build EXE
        run: python build_exe.py --edition ${{ matrix.edition }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.exe }}
          if-no-files-found: error

  build-docker:
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        edition: [homelab, office]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          # Homelab: :<version>, :<major>.<minor>, :latest
          # Office:  :<version>-office, :office
          tags: |
            type=semver,pattern={{version}},enable=${{ matrix.edition == 'homelab' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.edition == 'homelab' && needs.check-version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ matrix.edition == 'homelab' && needs.check-version.outputs.prerelease == 'false' }}
            type=semver,pattern={{version}},suffix=-office,enable=${{ matrix.edition == 'office' }}
            type=raw,value=office,enable=${{ matrix.edition == 'office' && needs.check-version.outputs.prerelease == 'false' }}

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.check-version.outputs.version }}
            EDITION=${{ matrix.edition }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [check-version, build-exe, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Windows EXEs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: OpenScanHub-Windows*
          merge-multiple: true
          path: dist/

      - name: Checksums
        working-directory: dist
        run: sha256sum OpenScanHub.exe OpenScanHub-Office.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest EXE provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/OpenScanHub.exe
            dist/OpenScanHub-Office.exe

      - name: Generate changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          PREV_TAG=$(git tag --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          DELIM="CHANGES_$(openssl rand -hex 16)"
          {
            echo "changes<<$DELIM"
            if [ -z "$PREV_TAG" ]; then
              echo "Initial release"
            else
              git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s" --no-merges
              echo
            fi
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/OpenScanHub.exe
            dist/OpenScanHub-Office.exe
            dist/SHA256SUMS.txt
          prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.check-version.outputs.prerelease == 'false' }}
          body: |
            ## What's changed

            ${{ steps.changelog.outputs.changes }}

            ## Install

            **Windows**: download `OpenScanHub.exe` below and double-click it.
            The EXE is not code-signed yet, so Windows SmartScreen may say
            "Windows protected your PC". Click **More info**, then **Run anyway**.
            To check the download first, run this in PowerShell and compare the
            result with `SHA256SUMS.txt`:
            ```powershell
            Get-FileHash .\OpenScanHub.exe -Algorithm SHA256
            ```
            Build provenance: `gh attestation verify OpenScanHub.exe --repo ${{ github.repository }}`

            **Office edition**: `OpenScanHub-Office.exe` has no Home Assistant or
            Paperless-NGX code, has the scan audit log on, and adds a scan-only token.

            | Edition | Windows | Docker tags |
            |---|---|---|
            | Homelab | `OpenScanHub.exe` | `:${{ steps.changelog.outputs.version }}`, `:latest` |
            | Office | `OpenScanHub-Office.exe` | `:${{ steps.changelog.outputs.version }}-office`, `:office` |

            **Docker** (linux/amd64 and linux/arm64):
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.changelog.outputs.version }}
            docker pull ghcr.io/${{ github.repository }}:${{ steps.changelog.outputs.version }}-office
            ```
          generate_release_notes: true
